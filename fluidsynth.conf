########################################
# FluidSynth Default Configuration
# File: ~/.fluidsynth
# Version: for FluidSynth v2.3.x
# Syntax: do NOT use "=", always "set <option> <value>"
########################################

########################################
# Basic audio settings
########################################

# Master gain (volume) – typically 0.5–1.0
set synth.gain 0.5

# Auto-connect to MIDI inputs (very handy in daily use)
set midi.autoconnect no

########################################
# Reverb – more spaciousness
########################################

# Enable
set synth.reverb.active yes
# Room size: 0.0 – 1.0 (larger = longer reverb tail)
set synth.reverb.room-size 0.4
# Treble damping: 0.0 – 1.0 (more = "warmer" reverb)
set synth.reverb.damp 0.6
# Stereo width: 0 – 100
set synth.reverb.width 80
# Reverb level: 0.0 – 1.0
set synth.reverb.level 0.25

########################################
# Chorus – fuller, wider sound
########################################

# Enable (optional – gives a wider, livelier sound)
set synth.chorus.active yes
# Number of voices: 0–99 (more = wider, more CPU load)
set synth.chorus.nr 5
# Modulation speed (Hz): 0.29 – 5.0
set synth.chorus.speed 0.3
# Depth: 0.0 – 21.0
set synth.chorus.depth 8.0
# Level: 0.0 – 10.0
set synth.chorus.level 2.0

########################################
# Misc (optional)
########################################

# Increase polyphony (default is often 256)
set synth.polyphony 512

# --- Pads ---
prog 0  89    # Warm Pad
prog 1  91    # Choir Pad
prog 2  94    # Halo Pad
prog 3  95    # Sweep Pad
prog 4  90    # Polysynth Pad

# --- Strings / Voices ---
prog 5  48    # String Ensemble 1
prog 6  50    # SynthStrings 1
prog 7  52    # Choir Aahs
prog 8  53    # Voice Oohs
select 9 1 0 54   # Synth Voice  (Channel 9! see below)

# --- Organs ---
prog 10 16    # Drawbar Organ
prog 11 19    # Church Organ
prog 12 20    # Reed Organ

# --- Brass / Flutes ---
prog 13 62    # Synth Brass 1
prog 14 75    # Pan Flute

# --- FX ---
prog 15 99    # Atmosphere
